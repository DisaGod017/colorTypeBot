welcome_message: |
  Привет,
  Я — ваш новый бот Твой цветотип|Your color type🌈!
  Моя цель помочь Вам определить собственный цветотип по фотографиям лица, а также подобрать подходящий макияж и соответствующий образ.

upload_photo_message: |
  Для определения цветотипа загрузите Ваше фото. 
  Для более точного результата используйте естественное освещение и откажитесь от макияжа. Смотрите прямо в камеру и захватите лицо полностью.

option_choosing_message: |
  Вы добавили фото.
  Далее выберите, что Вы хотите узнать помимо цветотипа.

no_photo_error: Пожалуйста, отправьте именно фотографию.

